name = "ComparatorChallenges"
version = "0.1.0"
defaultTargets = [
  "ComparatorChallenges",
  "BorisBukhChallenges",
  "HundredTheoremsChallenges",
  "MathOverflowChallenges",
  "WikipediaChallenges"
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

[[require]]
name = "Comparator"
git = "https://github.com/leanprover/comparator.git"
rev = "v4.32.0"

[[lean_lib]]
name = "ComparatorChallenges"
srcDir = "ErdosProblems"
roots = ["Erdos424", "Erdos469"]

[[lean_lib]]
name = "BorisBukhChallenges"
srcDir = "BorisBukh"
roots = ["BasisSubset"]

[[lean_lib]]
name = "HundredTheoremsChallenges"
srcDir = "HundredTheorems"
roots = ["Theorem8", "Theorem28", "Theorem61", "Theorem84", "Theorem87"]

[[lean_lib]]
name = "MathOverflowChallenges"
srcDir = "MathOverflow"
roots = ["MO420333", "MO508681", "MO509164", "MO509493"]

[[lean_lib]]
name = "WikipediaChallenges"
srcDir = "Wikipedia"
roots = ["CycleDoubleCoverConjecture"]
