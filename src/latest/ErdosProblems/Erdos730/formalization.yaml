related_formalizations:
  - id: "https://github.com/Woett/Lean-files/blob/main/ErdosProblem154.lean"
    relationship: "builds-on"
    note: "Lindström's residue-distribution theorem for the Sidon set itself, formalised by Aristotle (Harmonic) and Wouter van Doorn; reproduced as ErdosProblems/Erdos154/Lindstrom.lean with its header, and extended to the sumset statement in ErdosProblems/Erdos154/Sumset.lean. No licence is published upstream; see NOTICE."
  - id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
    relationship: "builds-on"
    note: "Pinned proof dependency supplying the prime number theorem in arithmetic progressions used by the #730 proof; not in any Challenge's import closure."
  - id: "https://github.com/google-deepmind/formal-conjectures/pull/664"
    relationship: "other"
    note: "AlphaProof's formal witness for the non-consecutive #730 pair (10003, 10005), recorded in Formal Conjectures as erdos_730.variants.delta_ne_one."

classification:
  arxiv: ["math.NT", "math.CO"]
  msc2020: ["11B65", "11N13", "11A41", "11B13"]

status:
  scope: >-
    Complete, kernel-checked proofs of the results listed under main_results, together with
    the component lemmas of the #730 development (indexed in proofs.yaml and audited in
    Audit.lean). Each registry-shaped statement under Palomar/<Problem>/ is one Comparator
    comparison: a Challenge importing only Mathlib, a Solution delegating to the proof here,
    and the configuration naming the compared declaration.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Palomar.Erdos730.erdos_730_infinite"
      file: "PalomarSolutions/Erdos730.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/Erdos730/comparator.json"
      literature_dependencies: []
    - declaration: "Palomar.Erdos154.erdos_154_sumset"
      file: "PalomarSolutions/Erdos154.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/Erdos154/comparator.json"
      literature_dependencies: []
    - declaration: "Palomar.Erdos94.sum_multiplicity"
      file: "PalomarSolutions/Erdos94.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "Palomar/Erdos94/comparator.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models: []
      framework: "Codex and Claude Code agent sessions"
      tool_setup: >-
        The #730 development was produced in AI-agent sessions directed and audited by the
        author, with an exact-arithmetic certificate suite (ErdosProblems/Erdos730/compute/) checking the
        numerical constants independently of Lean and hostile-audit plans retained under
        ErdosProblems/Erdos730/plans/. The #94 identity was produced by an OpenAI Codex agent session. The
        #154 sumset extension was produced in agent sessions over the third-party Lindström
        formalisation named in related_formalizations. Exact model identifiers and
        per-session costs were not recorded at the time and are not reconstructed here.
      prompting_notes: >-
        The informal #730 argument under formalisation was itself produced by a language
        model (GPT Pro, per the cited comment); its full text is a private document not
        linked publicly, so the formalisation was built from the public gist, the linked
        route mapping, and the author's own reconstruction of the analytic sections
        (ErdosProblems/Erdos730/compute/audit.md records the audit).
  spend_usd: "not reconstructed"
  notes: >-
    Every tracked theorem is rebuilt and axiom-audited on every push
    (.github/workflows/verify.yml), and each Palomar configuration is replayed through
    Comparator in CI with a non-adversarial sandbox stand-in; the registry's own run is
    the trusted one.

fidelity:
  divergences: >-
    #730: none in the statement — the Challenge inlines the Formal Conjectures set verbatim;
    the proof establishes the stronger consecutive-pair statement, available in the
    development as Erdos730.FullDensityCore.GoodParameter and the density theorems around
    it. #154: the Challenge states the sumset form Formal Conjectures records, which is
    the consequence proved here of Lindström's theorem for A itself, with IsSidon in the
    Formal Conjectures shape (two representations agree up to order). #94: an elementary
    bounded identity only; it does not prove the cubic distance-multiplicity theorem or
    the regular-polygon conjecture of that problem.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    Kernel-checked and axiom-audited in this repository's CI and reproduced from source by
    the author; no independent human review of the mathematics has been performed, and the
    informal #730 source argument is itself unadjudicated on erdosproblems.com. The #730
    statement is submitted to Palomar to obtain the registry's independent dual-kernel
    Comparator check; #154 waits on the upstream licence of the formalisation it builds
    on; #94 is below a registry's research-interest floor and is not submitted.

alignment:
  namespace: "Palomar"
  statements:
    - source: "Erdős #730: are there infinitely many n < m with binom(2n,n), binom(2m,m) sharing prime support?"
      lean: "Palomar.Erdos730.erdos_730_infinite"
      module: "Palomar.Erdos730.Challenge"
      status: "proved"
      note: "Answer yes; proof via Erdos730.FullDensityTheorem.pairSet_infinite."
    - source: "Erdős #154, sumset form: A + A equidistributed mod m along Sidon sets with |A| ~ sqrt N"
      lean: "Palomar.Erdos154.erdos_154_sumset"
      module: "Palomar.Erdos154.Challenge"
      status: "proved"
      note: "Proof via Erdos154.erdos_154_sumset, from Lindström's theorem."
    - source: "Erdős #94, sum_multiplicity variant: multiplicities of distinct distances sum to (|P| choose 2)"
      lean: "Palomar.Erdos94.sum_multiplicity"
      module: "Palomar.Erdos94.Challenge"
      status: "proved"
      note: "Proof via Erdos94.variants.sum_multiplicity."

