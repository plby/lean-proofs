    authors: ["Paul Erdős", "Ronald L. Graham", "Imre Z. Ruzsa", "Ernst G. Straus"]
    contributors:
      - name: "Thomas F. Bloom"
        role: "maintainer of erdosproblems.com, where the problem and its status are recorded"
    id: "https://www.erdosproblems.com/730"
    type: "web discussion"
    location: "problem statement and remarks; site status OPEN as of 21 August 2026"
    relationship: "background"
    author_endorsement: "n/a"
  - title: "Comment on Erdős Problem #730 asserting, with a one-paragraph gist, that GPT Pro proves infinitely many consecutive pairs (n, n+1)"
    authors: ["Liam Price"]
    id: "https://www.erdosproblems.com/forum/thread/730"
    type: "web discussion"
    location: "comment of 21:06 on 24 June 2026"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
  - title: "Closing derivation ('Proof Route Mapping') linked as a follow-up, reproducing the algebraic skeleton of the argument; the analytic sections exist only in a private document and are reconstructed in this formalisation"
    authors: ["Tomodovodoo (forum handle)"]
    id: "https://chatgpt.com/share/6a3c7e81-cab8-83eb-a247-cd10b62e80fb"
    type: "web discussion"
    location: "comment of 01:08 on 25 June 2026, and the linked shared conversation"
    relationship: "adapts"
    author_endorsement: "not-contacted"
  - title: "Bernt Lindström, 'Well distribution of Sidon sets in residue classes', J. Number Theory 69 (1998), 197–200"
    authors: ["Bernt Lindström"]
    id: "https://doi.org/10.1006/jnth.1997.2212"
    type: "paper"
    location: "the theorem that a Sidon set A with |A| ~ sqrt N is equidistributed in residue classes"
    relationship: "adapts"
    author_endorsement: "n/a"
  - title: "Erdős Problem #154 discussion (erdosproblems.com), including the post presenting Lindström's proof"
    authors: ["Thomas F. Bloom (site)"]
    id: "https://www.erdosproblems.com/forum/thread/154#post-4218"
    type: "web discussion"
    relationship: "background"
    author_endorsement: "n/a"
  - title: "Formal statements of Erdős Problems #730, #154, #94, #399 and #1074 in Formal Conjectures (the objects each Challenge restates)"
    authors: ["The Formal Conjectures Authors (Google DeepMind)"]
