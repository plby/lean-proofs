name = "lean-proofs-latest"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["All"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a => b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "leancert"
git = "https://github.com/alerad/leancert.git"
rev = "121ecfdf8ad1be18e9f4a4cda8496d99613dc373"

[[require]]
name = "ComparatorChallenges"
path = "ComparatorChallenges"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0-rc2"

[[lean_lib]]
name = "All"

[[lean_lib]]
name = "Arxiv"

[[lean_lib]]
name = "BorisBukh"

[[lean_lib]]
name = "ErdosProblems"

[[lean_lib]]
name = "HundredTheorems"

[[lean_lib]]
name = "MathOverflow"

[[lean_lib]]
name = "PrimeNumberTheoremAnd"

[[lean_lib]]
name = "Util"

[[lean_lib]]
name = "UnitFractions"

[[lean_lib]]
name = "Wikipedia"
